<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="/css/register.css">
</head>
<body>

<div class="container">

  <div class="register-box">

    <div class="logo">👤+</div>

    <h1>Luminary</h1>
    <p>Join us today — it takes just a moment</p>

    <form onsubmit="register(event)" autocomplete="off">

      <div class="row">
        <div>
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="Devendra"  required autocomplete="off">
        </div>

        <div>
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Reddy" required autocomplete="off">
        </div>
      </div>

      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="off">

      <label>Password</label>
      <div class="password-box">
        <input type="password" id="password" placeholder="Min 6 characters" required autocomplete="off">
        <span onclick="togglePassword()">👁️</span>
      </div>

      <div class="terms">
        <input type="checkbox" id="agree">
        <label>I agree to Terms & Privacy</label>
      </div>

      <button type="submit">Create Account</button>

    </form>

    <div class="footer">
      Already have an account? <a href="/pages/login.html">Sign in</a>
    </div>

  </div>

</div>

<script src="/js/register.js"></script>
</body>
</html>
