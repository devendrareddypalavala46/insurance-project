<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/css/forgot.css">
</head>
<body>

<div class="container">

  <h2>Reset Password</h2>

  <!-- EMAIL SECTION -->
  <div id="emailSection">
    <input type="email" id="email" placeholder="Enter email">
    <button id="sendOtpBtn" onclick="sendOtp(event)">Send OTP</button>
    <p class="error" id="emailError"></p>
  </div>

  <!-- OTP SECTION (hidden initially) -->
  <div id="otpSection" style="display: none;">
    <h3>Verify OTP</h3>
    <input type="text" id="otp" placeholder="Enter OTP">
    <button id="verifyOtp" onclick="verifyOtp()">Verify OTP</button>
    <p class="error" id="otpError"></p>
  </div>

  <p id="timerText"></p>

  <button id="resendBtn" style="display:none;" onclick="resendOtp()">Resend OTP</button>

  <!-- STEP 3: RESET PASSWORD -->
  <div class="step" id="step3">
    <h3>Reset Password</h3>
    <input type="password" id="password" placeholder="New Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <button onclick="resetPassword()">Reset Password</button>
    <p class="error" id="passError"></p>
    <p class="success" id="successMsg"></p>
  </div>
  <span id="passwordError" style="color:red;"></span>

</div>


<script src="/js/forgot.js"></script>

</body>
</html>
